name: Release

# Releases are tag-driven: the npm-publish flow bumps the version, generates
# the CHANGELOG.md section, publishes to npm, merges the version-bump pull
# request, and pushes an annotated v* tag at the merge commit. This workflow
# then creates the GitHub Release with auto-generated notes.
#
# The changelog deliberately lands via the version-bump pull request, not
# here: the protect-main-branch ruleset requires pull requests for every
# push to main (no bypass actors), and the repo setting "Allow GitHub
# Actions to create and approve pull requests" is disabled, so the
# GITHUB_TOKEN cannot open PRs. The npm-publish flow runs with full
# credentials and carries the changelog section in the same PR.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Serialize releases so concurrent tags cannot race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Fail before creating anything for tags outside the release
      # convention (e.g. prerelease suffixes), instead of half-succeeding.
      - name: Validate tag shape
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to release non-semver tag $GITHUB_REF_NAME (expected vX.Y.Z)"
            exit 1
          fi

      # npm publishes take a few minutes to propagate to the registry API;
      # poll for up to 10 minutes instead of checking once.
      - name: Verify the tag version is published to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            PUBLISHED=$(npm view "qwen-code-webui@$VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "v$VERSION is live on npm"
              exit 0
            fi
            echo "v$VERSION not visible on npm yet (attempt $i/20); waiting 30s"
            sleep 30
          done
          echo "::error::$GITHUB_REF_NAME was not visible on npm after 10 minutes"
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
