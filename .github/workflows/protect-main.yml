name: Protect Main Branch

on:
  push:
    branches: [main, master]

jobs:
  check-direct-push:
    runs-on: ubuntu-latest
    # Release automation (changelog commits from .github/workflows/release.yml)
    # is exempt alongside merge commits.
    if: "!startsWith(github.event.head_commit.message, 'Merge pull request') && !startsWith(github.event.head_commit.message, 'chore(changelog):')"
    steps:
      - name: Reject direct push to main
        run: |
          echo "::error::Direct pushes to main are not allowed. Please use a pull request."
          exit 1
