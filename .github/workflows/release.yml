name: Release

# Releases are tag-driven: the npm-publish flow bumps the version, publishes
# to npm, then pushes an annotated v* tag. This workflow then creates the
# GitHub Release (auto-generated notes) and documents the version in
# CHANGELOG.md — no manual release or changelog maintenance.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Serialize releases so concurrent tags cannot race on the changelog commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release + changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the tag version is published to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED=$(npm view "qwen-code-webui@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "::error::${GITHUB_REF_NAME} is not published to npm (found: '${PUBLISHED:-nothing}'). Publish to npm first, then tag."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Update CHANGELOG.md on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main

          if ! node scripts/update-changelog.js "$GITHUB_REF_NAME"; then
            echo "::error::changelog generation failed"
            exit 1
          fi

          if git diff --quiet CHANGELOG.md; then
            echo "no changelog changes to commit"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "chore(changelog): document $GITHUB_REF_NAME"
          # Retry once against a moved main tip; releases are serialized, so
          # this only races with ordinary merges.
          if ! git push origin main; then
            git pull --rebase origin main
            git push origin main
          fi
